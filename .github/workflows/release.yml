name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Typecheck · Test · Build · Publish · GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v3.3.0
          VERSION="${TAG#v}"                # e.g. 3.3.0

          # Extract the block between "## [VERSION]" and the next "## [" heading
          BODY=$(awk \
            -v ver="$VERSION" \
            'BEGIN { found=0 }
             /^## \[/ {
               if (found) exit
               if (index($0, "["ver"]") > 0) found=1
               next
             }
             found { print }' \
            CHANGELOG.md)

          # If nothing found, fall back to a minimal message
          if [ -z "$BODY" ]; then
            BODY="Release $TAG — see CHANGELOG.md for details."
          fi

          # Write to a temp file to avoid quoting/newline issues
          printf '%s' "$BODY" > /tmp/release_body.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release_body.md
