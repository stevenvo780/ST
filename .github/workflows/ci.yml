name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck · Test · Lint · Build · Bench
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # bench:compare compares benchmarks/results.json vs benchmarks/baselines.json.
      # baselines.json is committed to the repo. results.json is generated by
      # npm run bench. If baselines.json is empty or compare exits with code 2
      # (files missing), we treat it as a soft warning, not a hard failure.
      - name: Run benchmarks
        run: npm run bench

      - name: Compare benchmarks (warn ≥10% / fail ≥25%)
        run: |
          npm run bench:compare -- --warn 10 --fail 25 || {
            EXIT=$?
            if [ $EXIT -eq 2 ]; then
              echo "::warning::bench:compare exited with code 2 (baseline or results file missing). Skipping regression check."
              exit 0
            fi
            exit $EXIT
          }
