name: Performance Regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  bench:
    name: Bench v5 (regression)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Compare against baseline (PRs)
        if: github.event_name == 'pull_request'
        run: node scripts/bench/v5-regression.mjs

      - name: Update baseline (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/bench/v5-regression.mjs --update

      - name: Commit updated baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet benchmarks/baselines.json; then
            echo "baselines unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add benchmarks/baselines.json
            git commit -m "chore(bench): auto-update v5 baselines from $GITHUB_SHA"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: |
            benchmarks/results.json
            benchmarks/regression-report.json
          if-no-files-found: ignore
